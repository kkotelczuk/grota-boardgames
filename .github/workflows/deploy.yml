name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jeden deploy naraz; nowy push nie przerywa trwającego wdrożenia.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Opcjonalne nadpisanie (Settings → Secrets and variables → Actions → Variables).
  # Puste = wartości domyślne z astro.config.ts (grota.bialystok.pl, base /).
  SITE_URL: ${{ vars.SITE_URL }}
  BASE_PATH: ${{ vars.BASE_PATH }}

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build korzysta wyłącznie z danych w repo (src/data, data/) – bez BGG API i bez sekretów.
      - uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@12.8.1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
